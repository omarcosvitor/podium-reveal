<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1 por 1 — IASD do Jardim Europa</title>
<style>
  :root {
    --gold:   #f4c64b;
    --gold-2: #e0a52e;
    --gold-d: #8a5f12;
    --ink:    #0a1020;
    --line:   rgba(244,198,75,.22);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    user-select: none;
    font-family: "Bahnschrift", "DIN Alternate", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: #f4f6fb;
    background:
      radial-gradient(1400px 800px at 50% -15%, #243a66 0%, rgba(36,58,102,0) 58%),
      radial-gradient(ellipse at 50% 130%, #16243f 0%, #0a1020 55%, #050810 100%);
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100vh;
    padding: 3vh 2.5vw 2vh;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(16px, 3vw, 56px);
    margin-bottom: 1.4vh;
  }
  .logo-sda { height: clamp(52px, 10vh, 118px); width: auto; flex: none; color: var(--gold); }
  .logo-pg  { height: clamp(58px, 12vh, 138px); width: auto; flex: none;
              filter: drop-shadow(0 3px 10px rgba(0,0,0,.55)); }
  .brand { text-align: center; }
  .title {
    font-size: clamp(2.4rem, 6.5vw, 6.6rem);
    font-weight: 700;
    letter-spacing: -.005em;
    line-height: .9;
    color: #ffffff;
    text-shadow: 0 2px 16px rgba(0,0,0,.45);
  }
  .title b { color: var(--gold); font-weight: 700; }
  .subtitle {
    margin-top: .9vh;
    font-size: clamp(.8rem, 1.9vw, 1.45rem);
    font-weight: 600;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .stage {
    flex: 1;
    width: 100%;
    max-width: 1700px;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: clamp(10px, 2.4vw, 50px);
    padding-bottom: 2.5vh;
    min-height: 0;
  }

  .col {
    flex: 1 1 0;
    max-width: 19%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    transition: transform .6s cubic-bezier(.2,1,.3,1);
  }

  .label {
    position: absolute;
    left: -10%; right: -10%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .4vh;
    pointer-events: none;
  }
  .name {
    font-size: clamp(1.1rem, 2.6vw, 2.8rem);
    font-weight: 700;
    letter-spacing: .01em;
    text-align: center;
    white-space: nowrap;
    text-shadow: 0 2px 12px rgba(0,0,0,.65);
    opacity: 0;
    transition: opacity .25s ease;
  }
  .name.shuffling { opacity: 1; color: var(--gold); animation: blink .15s steps(1) infinite; }
  .name.revealed  { opacity: 1; animation: pop .55s cubic-bezier(.2,1.5,.4,1); }

  .track {
    width: 100%;
    flex: 1;
    position: relative;
    display: flex;
    align-items: flex-end;
    min-height: 0;
  }

  .ghost {
    width: 100%;
    position: relative;
    overflow: hidden;
    border: 1px solid var(--line);
    border-bottom: none;
    border-radius: 16px 16px 0 0;
    background:
      repeating-linear-gradient(180deg, rgba(244,198,75,.05) 0 2px, transparent 2px 14px);
    transition: box-shadow .5s ease, border-color .5s ease;
  }
  .ghost.lit {
    border-color: rgba(244,198,75,.55);
    box-shadow: 0 0 46px rgba(244,198,75,.35);
  }

  .fill {
    position: absolute;
    inset: auto 0 0 0;
    height: 0;
    border-radius: 15px 15px 0 0;
    background:
      linear-gradient(180deg, rgba(255,255,255,.4), rgba(255,255,255,0) 20%),
      linear-gradient(180deg, #fce7a4 0%, var(--gold) 32%, var(--gold-2) 78%, var(--gold-d) 100%);
    box-shadow:
      inset 0 3px 0 rgba(255,255,255,.6),
      inset 0 -14px 30px rgba(120,80,0,.4);
    transition: height .85s cubic-bezier(.2,.85,.25,1);
  }

  .base {
    width: 110%;
    padding: 1vh 0 1.2vh;
    text-align: center;
    background: linear-gradient(180deg, #18233c, #0c1426);
    border: 1px solid var(--line);
    border-top: none;
    border-radius: 0 0 14px 14px;
    box-shadow: 0 14px 30px rgba(0,0,0,.5);
  }
  .medal { font-size: clamp(1.6rem, 4.2vw, 3.6rem); line-height: 1; }
  .place {
    font-size: clamp(1rem, 2.5vw, 2.3rem);
    font-weight: 900;
    color: var(--gold);
    letter-spacing: .03em;
  }

  .col.winner { transform: translateY(-1.2vh) scale(1.04); }
  .col.winner .ghost.lit { box-shadow: 0 0 80px rgba(244,198,75,.6); border-color: rgba(255,235,160,.9); }
  .col.winner .name { color: #ffffff; text-shadow: 0 0 24px rgba(244,198,75,.85), 0 2px 10px rgba(0,0,0,.7); }
  .col.winner .place { color: #fff; }
  .crown {
    font-size: clamp(1.4rem, 3.4vw, 2.8rem);
    line-height: 1;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .4s ease, transform .4s cubic-bezier(.2,1.5,.4,1);
  }
  .col.winner .crown { opacity: 1; transform: none; }

  .controls { display: flex; align-items: center; gap: 16px; }
  button.play {
    font-size: clamp(1.05rem, 2vw, 1.8rem);
    font-weight: 800;
    letter-spacing: .01em;
    padding: .72em 2em;
    border: none;
    border-radius: 999px;
    color: #2a1c02;
    cursor: pointer;
    background: linear-gradient(180deg, #ffe79a, var(--gold) 48%, var(--gold-2));
    box-shadow: 0 10px 30px rgba(244,198,75,.4), inset 0 1px 0 rgba(255,255,255,.7);
    transition: transform .12s ease, filter .2s ease, opacity .25s ease;
  }
  button.play:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.06); }
  button.play:active:not(:disabled) { transform: translateY(0) scale(.98); }
  button.play:disabled { opacity: .4; cursor: default; }

  button.fs {
    font-size: clamp(1rem, 1.6vw, 1.4rem);
    background: rgba(255,255,255,.06);
    color: var(--gold);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: .6em .8em;
    cursor: pointer;
    transition: background .2s ease;
  }
  button.fs:hover { background: rgba(255,255,255,.14); }

  @keyframes blink { 0%{opacity:1} 50%{opacity:.2} 100%{opacity:1} }
  @keyframes pop { 0%{transform:scale(.4)} 70%{transform:scale(1.15)} 100%{transform:scale(1)} }

  .confetti {
    position: fixed; top: -6vh; width: 12px; height: 18px;
    z-index: 50; pointer-events: none; will-change: transform; border-radius: 2px;
  }
  @keyframes fall {
    0%   { transform: translateY(-12vh) rotateZ(0); opacity: 1; }
    100% { transform: translateY(114vh) rotateZ(720deg); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .001ms !important; animation: none !important; }
  }
</style>
</head>

  <div class="stage" id="stage"></div>

  <div class="controls">
    <button class="play" id="playBtn"></button>
    <button class="fs" id="fsBtn" title="Tela cheia">⛶</button>
  </div>

<script>
  const CONFIG = {
    title:    '1 por <b>1</b>',
    subtitle: 'IASD do Jardim Europa',
    teams: [
      { place: 5, name: 'Ebenezer', score: 100 },
      { place: 4, name: 'Adonai',   score: 500 },
      { place: 3, name: 'Águia',    score: 600 },
      { place: 2, name: 'Jovem',    score: 700 },
      { place: 1, name: 'Maranata', score: 800 },
    ],
  };

  function pyramid(n) {
    const left = [], right = [];
    for (let p = 2; p <= n; p++) (p % 2 ? left : right).push(p);
    return [...left.reverse(), 1, ...right];
  }
  console.assert(pyramid(5).join() === '5,3,1,2,4', 'pyramid(5) layout');

  const places = [...CONFIG.teams].sort((a, b) => b.place - a.place);
  const allNames = places.map(p => p.name);
  const MAX = Math.max(...places.map(p => p.score));
  const layout = pyramid(places.length);
  const firstBtnText = 'Revelar ' + places[0].place + 'º lugar';

  document.querySelector('.title').innerHTML = CONFIG.title;
  document.querySelector('.subtitle').textContent = CONFIG.subtitle;
  document.title = CONFIG.title.replace(/<[^>]+>/g, '') + ' — ' + CONFIG.subtitle;

  const MAXH = 76;
  const medals = { 1: '🥇', 2: '🥈', 3: '🥉' };
  const byPlace = Object.fromEntries(places.map(p => [p.place, p]));
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const stage   = document.getElementById('stage');
  const playBtn = document.getElementById('playBtn');
  const fsBtn   = document.getElementById('fsBtn');
  const cols = {};

  function build() {
    stage.innerHTML = '';
    for (const placeNum of layout) {
      const data = byPlace[placeNum];
      const hp = data.score / MAX * MAXH;
      const col = document.createElement('div');
      col.className = 'col';
      col.innerHTML = `
        <div class="track">
          <div class="label" style="bottom:calc(${hp}% + 1.2vh)">
            ${placeNum === 1 ? '<div class="crown">👑</div>' : ''}
            <div class="name"></div>
          </div>
          <div class="ghost" style="height:${hp}%">
            <div class="fill"></div>
          </div>
        </div>
        <div class="base">
          <div class="medal">${medals[placeNum] || ''}</div>
          <div class="place">${placeNum}º lugar</div>
        </div>`;
      stage.append(col);
      cols[placeNum] = {
        col,
        name:  col.querySelector('.name'),
        ghost: col.querySelector('.ghost'),
        fill:  col.querySelector('.fill'),
      };
    }
  }

  let step = 0, busy = false;
  let remaining = allNames.slice();
  const SHUFFLE_MS = 2000, TICK_MS = 45;

  function reveal() {
    if (busy) return;
    if (step >= places.length) { reset(); return; }

    busy = true; playBtn.disabled = true;
    const { place, name } = places[step];
    const el = cols[place];

    el.ghost.classList.add('lit');
    el.fill.style.height = '100%';

    const lockIn = () => {
      el.name.classList.remove('shuffling');
      el.name.classList.add('revealed');
      el.name.textContent = name;
      remaining = remaining.filter(n => n !== name);
      if (place === 1) { el.col.classList.add('winner'); launchConfetti(); playBtn.textContent = 'Reiniciar'; }
      else { playBtn.textContent = 'Revelar ' + places[step + 1].place + 'º lugar'; }
      step++; busy = false; playBtn.disabled = false;
    };

    if (reduce || remaining.length <= 1) { setTimeout(lockIn, 600); return; }

    el.name.classList.add('shuffling');
    const shuffle = setInterval(() => {
      el.name.textContent = remaining[Math.floor(Math.random() * remaining.length)];
    }, TICK_MS);
    setTimeout(() => { clearInterval(shuffle); lockIn(); }, SHUFFLE_MS);
  }

  function reset() {
    step = 0; busy = false; remaining = allNames.slice();
    for (const p in cols) {
      const el = cols[p];
      el.fill.style.height = '0';
      el.ghost.classList.remove('lit');
      el.col.classList.remove('winner');
      el.name.className = 'name'; el.name.textContent = '';
    }
    playBtn.textContent = firstBtnText;
    playBtn.disabled = false;
  }

  const CONF = ['#f4c64b', '#ffffff', '#ffe79a', '#e0a52e', '#fff3c4', '#c9941f'];
  function launchConfetti() {
    if (reduce) return;
    for (let i = 0; i < 150; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = CONF[i % CONF.length];
      c.style.width  = (6 + Math.random() * 10) + 'px';
      c.style.height = (10 + Math.random() * 14) + 'px';
      const dur = 2.6 + Math.random() * 2.4;
      c.style.animation = `fall ${dur}s linear ${Math.random() * .6}s forwards`;
      document.body.append(c);
      setTimeout(() => c.remove(), (dur + 1.2) * 1000);
    }
  }

  playBtn.addEventListener('click', reveal);
  fsBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  });
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (!playBtn.disabled) reveal(); }
  });

  build();
  playBtn.textContent = firstBtnText;
</script>
</body>
</html>
